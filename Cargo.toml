[package]
name = "quarry"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "One docs repo for many code repos, queryable by agents and people"
repository = "https://github.com/GentBajko/quarry"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "0.0.10"
thiserror = "2"
tempfile = "3.10"
regex = "1.10"
jiff = { version = "0.2", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
